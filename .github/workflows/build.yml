name: Build Dual Wield Plugin

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      - name: Restore
        run: dotnet restore DualWieldTShock.csproj

      - name: Build
        run: dotnet build DualWieldTShock.csproj -c Release --no-restore

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: DualWieldTShock
          path: bin/Release/net9.0/DualWieldTShock.dll
          if-no-files-found: error
